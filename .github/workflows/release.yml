name: Build & Release plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python3 -m json.tool plugin/config.json > /dev/null
          for f in plugin/translations/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: Check required marketplace files and fields
        run: |
          for f in config.json index.html scripts/pluginCode.js CHANGELOG.md; do
            test -f "plugin/$f" || { echo "Missing plugin/$f"; exit 1; }
          done
          python3 - << 'PY'
          import json, re
          c = json.load(open("plugin/config.json", encoding="utf-8"))
          assert re.fullmatch(r"\d+\.\d+\.\d+", c["version"]), "version must be x.x.x"
          assert c.get("offered"), "missing 'offered'"
          st = c["variations"][0].get("store", {})
          for k in ("background", "icons", "categories"):
              assert k in st, f"missing store.{k}"
          if "screenshots" not in st:
              print("::warning::store.screenshots is missing (required for plugins with an interface)")
          PY

      - name: Check referenced icons exist
        run: |
          python3 - << 'PY'
          import json, os
          cfg = json.load(open("plugin/config.json", encoding="utf-8"))
          v = cfg["variations"][0]
          paths = list(v["icons"])
          for theme in v.get("icons2", []):
              paths += [x["normal"] for k, x in theme.items() if isinstance(x, dict)]
          missing = [p for p in paths if not os.path.exists(os.path.join("plugin", p))]
          assert not missing, f"Missing icons: {missing}"
          print("Icons OK:", len(paths))
          PY

      - name: Check JavaScript syntax
        run: node --check plugin/scripts/pluginCode.js

      - name: Package .plugin (zip with files at the root)
        run: |
          cd plugin
          zip -r ../auto-latex-equations.plugin . -x "*.DS_Store"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-latex-equations
          path: auto-latex-equations.plugin

      - name: Create GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: auto-latex-equations.plugin
          generate_release_notes: true
